    <!--
      Resolve the theme BEFORE first paint so there is no flash of the wrong
      palette. An explicit choice in localStorage wins; otherwise follow the OS.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            theme = "light";
          }
        } catch (e) {
          /* storage blocked — keep the default */
        }
        document.documentElement.setAttribute("data-theme", theme);
        // same rule as useLanguage: stored choice, else the browser language
        try {
          var lang = localStorage.getItem("lang");
          if (lang !== "en" && lang !== "id") {
            lang = /^id\b/i.test(navigator.language || "") ? "id" : "en";
          }
          document.documentElement.lang = lang;
        } catch (e) {
          /* storage blocked — keep lang="en" */
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#F6F8FC" : "#070C16");
      })();
    </script>

    <style>
      /* paint the correct ground before the CSS bundle arrives */
      html[data-theme="dark"] {
        background-color: #070c16;
      }
      html[data-theme="light"] {
        background-color: #f6f8fc;
      }
    </style>
